name: Apply Research News Changelog

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/zz-apply-research-news-changelog.yml"

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main
        uses: actions/checkout@v5
        with:
          ref: main

      - name: Patch changelog
        run: python scripts/apply_research_news_changelog.py

      - name: Commit changelog if changed
        run: |
          if git diff --quiet -- docs/CHANGELOG.md; then
            echo "No changelog change required"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/CHANGELOG.md
          git commit -m "Document research news change radar"
          git push origin HEAD:main
