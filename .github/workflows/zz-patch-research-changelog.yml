name: Patch Research Changelog

on:
  push:
    branches: [main]
    paths:
      - "scripts/patch_research_changelog.py"
      - ".github/workflows/zz-patch-research-changelog.yml"

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Patch changelog
        run: python scripts/patch_research_changelog.py

      - name: Commit changelog
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/CHANGELOG.md
          if git diff --cached --quiet; then
            echo "No changelog changes to commit"
            exit 0
          fi
          git commit -m "Document US research platform changes"
          git push origin HEAD:main
