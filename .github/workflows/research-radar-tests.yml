name: Research Radar Tests

on:
  push:
    branches: [main]
    paths:
      - "src/repositories/candidate_pool_repo.py"
      - "src/services/screening/industry_radar.py"
      - "scripts/run_us_research_scan.py"
      - "tests/test_candidate_pool_repo.py"
      - "tests/test_candidate_pool_industry_metrics.py"
      - "tests/test_industry_radar.py"
      - ".github/workflows/research-radar-tests.yml"
  workflow_dispatch:

jobs:
  focused-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run focused research radar tests
        run: |
          python -m pytest -q \
            tests/test_candidate_pool_repo.py \
            tests/test_candidate_pool_industry_metrics.py \
            tests/test_industry_radar.py

      - name: Import smoke test for US research scan
        run: python -c "import scripts.run_us_research_scan; print('run_us_research_scan import ok')"
