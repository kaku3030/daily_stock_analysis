name: Apply Research State Persistence

on:
  push:
    branches: [main]
    paths:
      - "scripts/apply_research_state_persistence.py"
      - ".github/workflows/zz-apply-research-state-persistence.yml"

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Apply workflow patch
        run: python scripts/apply_research_state_persistence.py

      - name: Validate workflow YAML
        run: |
          python -m pip install --quiet pyyaml
          python - <<'PY'
          from pathlib import Path
          import yaml

          path = Path('.github/workflows/00-daily-analysis.yml')
          data = yaml.safe_load(path.read_text(encoding='utf-8'))
          if not isinstance(data, dict) or 'jobs' not in data:
              raise SystemExit('invalid workflow structure')
          text = path.read_text(encoding='utf-8')
          for required in (
              'actions/cache/restore@v4',
              'actions/cache/save@v4',
              'PRAGMA quick_check',
              'PRAGMA wal_checkpoint(TRUNCATE)',
          ):
              if required not in text:
                  raise SystemExit(f'missing {required}')
          print('daily workflow persistence patch validated')
          PY

      - name: Commit patched daily workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .github/workflows/00-daily-analysis.yml
          git rm scripts/apply_research_state_persistence.py
          git rm .github/workflows/zz-apply-research-state-persistence.yml
          if git diff --cached --quiet; then
            echo "No workflow patch changes to commit"
            exit 0
          fi
          git commit -m "Persist research state across daily runs"
          git push origin HEAD:main
