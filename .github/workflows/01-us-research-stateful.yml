name: US Research Stateful Scan

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/01-us-research-stateful.yml"
  schedule:
    - cron: '20 10 * * 1-5'
  workflow_dispatch:
    inputs:
      action:
        description: '手动操作'
        required: true
        default: 'telegram-test'
        type: choice
        options:
          - telegram-test
          - scan
      send_alerts:
        description: '本次 scan 允许发送研究事件提醒'
        required: false
        default: false
        type: boolean

concurrency:
  group: us-research-stateful
  cancel-in-progress: false

jobs:
  validate-save:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - name: Create synthetic SQLite state
        run: |
          mkdir -p data
          python - <<'PY'
          import sqlite3
          from pathlib import Path

          db = Path('data/stock_analysis.db')
          with sqlite3.connect(db) as connection:
              connection.execute('CREATE TABLE research_state_probe (value TEXT NOT NULL)')
              connection.execute("INSERT INTO research_state_probe(value) VALUES ('cache-roundtrip-ok')")
              connection.commit()
              result = connection.execute('PRAGMA quick_check').fetchone()[0]
          if str(result).lower() != 'ok':
              raise SystemExit(f'quick_check failed before cache save: {result}')
          print('✅ Synthetic SQLite state created')
          PY

      - name: Save synthetic state cache
        uses: actions/cache/save@v4
        with:
          path: data/stock_analysis.db
          key: us-research-state-ci-${{ runner.os }}-${{ github.run_id }}

  validate-restore:
    if: github.event_name == 'push'
    needs: validate-save
    runs-on: ubuntu-latest
    steps:
      - name: Restore synthetic state cache
        uses: actions/cache/restore@v4
        with:
          path: data/stock_analysis.db
          key: us-research-state-ci-${{ runner.os }}-${{ github.run_id }}

      - name: Verify restored SQLite state
        run: |
          python - <<'PY'
          import sqlite3
          from pathlib import Path

          db = Path('data/stock_analysis.db')
          if not db.exists():
              raise SystemExit('restored database is missing')
          with sqlite3.connect(db) as connection:
              result = connection.execute('PRAGMA quick_check').fetchone()[0]
              value = connection.execute('SELECT value FROM research_state_probe').fetchone()[0]
          if str(result).lower() != 'ok':
              raise SystemExit(f'quick_check failed after cache restore: {result}')
          if value != 'cache-roundtrip-ok':
              raise SystemExit(f'unexpected restored value: {value!r}')
          print('✅ GitHub Cache -> SQLite roundtrip verified')
          PY

  telegram-test:
    if: github.event_name == 'workflow_dispatch' && inputs.action == 'telegram-test'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Send Telegram test message
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          python - <<'PY'
          import json
          import os
          import urllib.parse
          import urllib.request

          token = os.getenv('TELEGRAM_BOT_TOKEN', '').strip()
          chat_id = os.getenv('TELEGRAM_CHAT_ID', '').strip()
          if not token:
              raise SystemExit('TELEGRAM_BOT_TOKEN is not configured')
          if not chat_id:
              raise SystemExit('TELEGRAM_CHAT_ID is not configured')

          payload = urllib.parse.urlencode({
              'chat_id': chat_id,
              'text': '✅ daily_stock_analysis Telegram 通知测试成功\n\n研究提醒通道已经连接。',
          }).encode('utf-8')
          request = urllib.request.Request(
              f'https://api.telegram.org/bot{token}/sendMessage',
              data=payload,
              method='POST',
          )
          try:
              with urllib.request.urlopen(request, timeout=20) as response:
                  result = json.loads(response.read().decode('utf-8'))
          except Exception as exc:
              raise SystemExit(f'Telegram test request failed: {exc}') from exc
          if not result.get('ok'):
              raise SystemExit(f'Telegram API rejected the test: {result}')
          message_id = (result.get('result') or {}).get('message_id')
          print(f'✅ Telegram test delivered, message_id={message_id}')
          PY

  scan:
    if: >-
      (github.event_name == 'workflow_dispatch' && inputs.action == 'scan') ||
      (github.event_name == 'schedule' && vars.US_RESEARCH_STATEFUL_ENABLED == 'true')
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Create state directories
        run: mkdir -p data reports/screening logs

      - name: Restore research state database
        id: research-state-restore
        uses: actions/cache/restore@v4
        with:
          path: |
            data/stock_analysis.db
            data/stock_analysis.db-wal
            data/stock_analysis.db-shm
            data/us_universe.last_good.json
            data/us_valuation.last_good.json
          key: us-research-state-v1-${{ runner.os }}-${{ github.run_id }}
          restore-keys: |
            us-research-state-v1-${{ runner.os }}-

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest

      - name: Validate restored research state
        if: steps.research-state-restore.outputs.cache-matched-key != ''
        run: |
          python - <<'PY'
          import sqlite3
          from pathlib import Path

          db = Path('data/stock_analysis.db')
          if not db.exists():
              print('ℹ️ Cache matched but main database is absent; continuing from empty state')
              raise SystemExit(0)

          try:
              with sqlite3.connect(db) as connection:
                  result = connection.execute('PRAGMA quick_check').fetchone()[0]
              if str(result).lower() != 'ok':
                  raise RuntimeError(f'PRAGMA quick_check={result}')
              print('✅ Restored research database: quick_check=ok')
          except Exception as exc:
              print(f'⚠️ Restored research database is invalid; resetting state: {exc}')
              for suffix in ('', '-wal', '-shm'):
                  path = Path(f'{db}{suffix}')
                  if path.exists():
                      path.unlink()
          PY

      - name: Run US research scan
        env:
          DATABASE_PATH: ./data/stock_analysis.db
          ANALYSIS_OUTPUT_MODE: research
          REPORT_LANGUAGE: ${{ vars.REPORT_LANGUAGE || 'zh' }}

          US_RESEARCH_SCAN_ENABLED: 'true'
          US_RESEARCH_STRATEGY: ${{ vars.US_RESEARCH_STRATEGY || 'us_research_priority' }}
          US_RESEARCH_MAX_RESULTS: ${{ vars.US_RESEARCH_MAX_RESULTS || '10' }}
          US_RESEARCH_DAILY_CANDIDATES: ${{ vars.US_RESEARCH_DAILY_CANDIDATES || '40' }}
          US_RESEARCH_CONTEXT_CANDIDATES: ${{ vars.US_RESEARCH_CONTEXT_CANDIDATES || '20' }}
          US_RESEARCH_LLM_ENABLED: ${{ vars.US_RESEARCH_LLM_ENABLED || 'true' }}
          SCREENING_US_UNIVERSE_SOURCE: ${{ vars.SCREENING_US_UNIVERSE_SOURCE || 'sp500_nasdaq100' }}
          SCREENING_US_UNIVERSE_CACHE_PATH: ./data/us_universe.last_good.json
          SCREENING_US_UNIVERSE_CACHE_MAX_AGE_HOURS: ${{ vars.SCREENING_US_UNIVERSE_CACHE_MAX_AGE_HOURS || '168' }}
          US_RESEARCH_REQUIRED_UNIVERSE_SOURCE: ${{ vars.US_RESEARCH_REQUIRED_UNIVERSE_SOURCE || 'sp500_nasdaq100' }}
          US_RESEARCH_MIN_UNIVERSE_SIZE: ${{ vars.US_RESEARCH_MIN_UNIVERSE_SIZE || '400' }}
          US_RESEARCH_MIN_UNIVERSE_COVERAGE: ${{ vars.US_RESEARCH_MIN_UNIVERSE_COVERAGE || '0.80' }}
          INDUSTRY_PROVIDER: ${{ vars.INDUSTRY_PROVIDER || 'none' }}
          SCREENING_SOURCE_CALL_TIMEOUT_SEC: ${{ vars.SCREENING_SOURCE_CALL_TIMEOUT_SEC }}
          SCREENING_SNAPSHOT_CALL_TIMEOUT_SEC: ${{ vars.SCREENING_SNAPSHOT_CALL_TIMEOUT_SEC }}
          SCREENING_DAILY_CALL_TIMEOUT_SEC: ${{ vars.SCREENING_DAILY_CALL_TIMEOUT_SEC }}

          GENERATION_BACKEND: ${{ vars.GENERATION_BACKEND || secrets.GENERATION_BACKEND || 'litellm' }}
          GENERATION_FALLBACK_BACKEND: ${{ vars.GENERATION_FALLBACK_BACKEND || secrets.GENERATION_FALLBACK_BACKEND || 'litellm' }}
          LITELLM_CONFIG: ${{ vars.LITELLM_CONFIG || secrets.LITELLM_CONFIG }}
          LITELLM_CONFIG_YAML: ${{ vars.LITELLM_CONFIG_YAML || secrets.LITELLM_CONFIG_YAML }}
          LITELLM_API_KEY: ${{ secrets.LITELLM_API_KEY }}
          LITELLM_MODEL: ${{ vars.LITELLM_MODEL || secrets.LITELLM_MODEL }}
          LITELLM_FALLBACK_MODELS: ${{ vars.LITELLM_FALLBACK_MODELS || secrets.LITELLM_FALLBACK_MODELS }}
          LLM_CHANNELS: ${{ vars.LLM_CHANNELS || secrets.LLM_CHANNELS }}
          LLM_TEMPERATURE: ${{ vars.LLM_TEMPERATURE || secrets.LLM_TEMPERATURE }}

          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_API_KEYS: ${{ secrets.GEMINI_API_KEYS }}
          GEMINI_MODEL: ${{ vars.GEMINI_MODEL || secrets.GEMINI_MODEL || 'gemini-3-flash-preview' }}
          GEMINI_MODEL_FALLBACK: ${{ vars.GEMINI_MODEL_FALLBACK || secrets.GEMINI_MODEL_FALLBACK || 'gemini-3-flash-preview' }}
          AIHUBMIX_KEY: ${{ secrets.AIHUBMIX_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENAI_API_KEYS: ${{ secrets.OPENAI_API_KEYS }}
          OPENAI_BASE_URL: ${{ vars.OPENAI_BASE_URL || secrets.OPENAI_BASE_URL }}
          OPENAI_MODEL: ${{ vars.OPENAI_MODEL || secrets.OPENAI_MODEL }}
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          DEEPSEEK_API_KEYS: ${{ secrets.DEEPSEEK_API_KEYS }}
          ANSPIRE_API_KEYS: ${{ secrets.ANSPIRE_API_KEYS }}
          ANSPIRE_LLM_MODEL: ${{ vars.ANSPIRE_LLM_MODEL || secrets.ANSPIRE_LLM_MODEL }}
          ANSPIRE_LLM_BASE_URL: ${{ vars.ANSPIRE_LLM_BASE_URL || secrets.ANSPIRE_LLM_BASE_URL }}
          ANSPIRE_LLM_ENABLED: ${{ vars.ANSPIRE_LLM_ENABLED || secrets.ANSPIRE_LLM_ENABLED }}

          FINNHUB_API_KEY: ${{ secrets.FINNHUB_API_KEY }}
          ALPHAVANTAGE_API_KEY: ${{ secrets.ALPHAVANTAGE_API_KEY }}
          LONGBRIDGE_OAUTH_CLIENT_ID: ${{ vars.LONGBRIDGE_OAUTH_CLIENT_ID || secrets.LONGBRIDGE_OAUTH_CLIENT_ID }}
          LONGBRIDGE_OAUTH_TOKEN_CACHE_B64: ${{ secrets.LONGBRIDGE_OAUTH_TOKEN_CACHE_B64 }}
          LONGBRIDGE_APP_KEY: ${{ secrets.LONGBRIDGE_APP_KEY }}
          LONGBRIDGE_APP_SECRET: ${{ secrets.LONGBRIDGE_APP_SECRET }}
          LONGBRIDGE_ACCESS_TOKEN: ${{ secrets.LONGBRIDGE_ACCESS_TOKEN }}
          LONGBRIDGE_REGION: ${{ vars.LONGBRIDGE_REGION || secrets.LONGBRIDGE_REGION }}

          BOCHA_API_KEYS: ${{ secrets.BOCHA_API_KEYS }}
          TAVILY_API_KEYS: ${{ secrets.TAVILY_API_KEYS }}
          SERPAPI_API_KEYS: ${{ secrets.SERPAPI_API_KEYS }}
          MINIMAX_API_KEYS: ${{ secrets.MINIMAX_API_KEYS }}
          BRAVE_API_KEYS: ${{ secrets.BRAVE_API_KEYS }}
          SEARXNG_BASE_URLS: ${{ vars.SEARXNG_BASE_URLS || secrets.SEARXNG_BASE_URLS }}
          SEARXNG_PUBLIC_INSTANCES_ENABLED: ${{ vars.SEARXNG_PUBLIC_INSTANCES_ENABLED || secrets.SEARXNG_PUBLIC_INSTANCES_ENABLED }}

          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          TELEGRAM_MESSAGE_THREAD_ID: ${{ secrets.TELEGRAM_MESSAGE_THREAD_ID }}
          NOTIFICATION_ALERT_CHANNELS: ${{ vars.NOTIFICATION_ALERT_CHANNELS || secrets.NOTIFICATION_ALERT_CHANNELS || 'telegram' }}
          NOTIFICATION_DEDUP_TTL_SECONDS: ${{ vars.NOTIFICATION_DEDUP_TTL_SECONDS || secrets.NOTIFICATION_DEDUP_TTL_SECONDS || '86400' }}
          NOTIFICATION_COOLDOWN_SECONDS: ${{ vars.NOTIFICATION_COOLDOWN_SECONDS || secrets.NOTIFICATION_COOLDOWN_SECONDS || '21600' }}
          NOTIFICATION_TIMEZONE: ${{ vars.NOTIFICATION_TIMEZONE || secrets.NOTIFICATION_TIMEZONE || 'Asia/Tokyo' }}
          STOCK_RADAR_QA_OUTPUT_DIR: ./reports/screening
          STOCK_RADAR_TIMEZONE: ${{ vars.STOCK_RADAR_TIMEZONE || 'Asia/Shanghai' }}
          STOCK_RADAR_PRODUCTION_WEIGHTS_JSON: ${{ vars.STOCK_RADAR_PRODUCTION_WEIGHTS_JSON || '{}' }}

          SCHEDULED_ALERTS_ENABLED: ${{ vars.US_RESEARCH_ALERTS_ENABLED || 'false' }}
          MANUAL_ALERTS_ENABLED: ${{ inputs.send_alerts || false }}
        run: |
          if [ -n "$LITELLM_CONFIG_YAML" ] && [ -n "$LITELLM_CONFIG" ]; then
            mkdir -p "$(dirname "$LITELLM_CONFIG")"
            echo "$LITELLM_CONFIG_YAML" > "$LITELLM_CONFIG"
          fi

          ALERT_ARG=""
          if [ "${{ github.event_name }}" = "schedule" ] && [ "${SCHEDULED_ALERTS_ENABLED,,}" = "true" ]; then
            ALERT_ARG="--send-research-alerts"
          elif [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ "${MANUAL_ALERTS_ENABLED,,}" = "true" ]; then
            ALERT_ARG="--send-research-alerts"
          fi

          if [ -n "$ALERT_ARG" ]; then
            echo "📨 研究事件真实通知：已启用"
          else
            echo "🔕 研究事件真实通知：未启用，仅生成提醒候选"
          fi
          python scripts/run_us_research_scan.py $ALERT_ARG

          QA_ALERT_ARG=""
          if [ -n "$ALERT_ARG" ]; then
            QA_ALERT_ARG="--send-alerts"
          fi
          python scripts/run_stock_radar_qa.py --action auto $QA_ALERT_ARG

      - name: Checkpoint and validate research state
        if: always() && hashFiles('data/stock_analysis.db') != ''
        run: |
          python - <<'PY'
          import sqlite3
          from pathlib import Path

          db = Path('data/stock_analysis.db')
          try:
              with sqlite3.connect(db) as connection:
                  connection.execute('PRAGMA wal_checkpoint(TRUNCATE)')
                  result = connection.execute('PRAGMA quick_check').fetchone()[0]
                  if str(result).lower() != 'ok':
                      raise RuntimeError(f'PRAGMA quick_check={result}')

                  tables = {
                      row[0]
                      for row in connection.execute(
                          "SELECT name FROM sqlite_master WHERE type='table'"
                      )
                  }
                  tracked = (
                      'research_candidate_pool',
                      'research_candidate_financial_snapshots',
                      'research_candidate_financial_changes',
                      'research_priority_events',
                      'stock_radar_technical_state_snapshots',
                      'stock_radar_validation_queue',
                      'stock_radar_calibration_reviews',
                  )
                  for table in tracked:
                      if table in tables:
                          count = connection.execute(
                              f'SELECT COUNT(*) FROM {table}'
                          ).fetchone()[0]
                          print(f'📚 {table}: {count} rows')
              print('✅ Research database checkpoint complete: quick_check=ok')
          except Exception as exc:
              print(f'⚠️ Research state validation failed; corrupt state will not be cached: {exc}')
              for suffix in ('', '-wal', '-shm'):
                  path = Path(f'{db}{suffix}')
                  if path.exists():
                      path.unlink()
          PY

      - name: Save research state database
        if: always() && hashFiles('data/stock_analysis.db') != ''
        uses: actions/cache/save@v4
        with:
          path: |
            data/stock_analysis.db
            data/stock_analysis.db-wal
            data/stock_analysis.db-shm
            data/us_universe.last_good.json
            data/us_valuation.last_good.json
          key: us-research-state-v1-${{ runner.os }}-${{ github.run_id }}

      - name: Upload research reports
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: us-research-reports-${{ github.run_number }}
          path: |
            reports/screening/
            logs/
          if-no-files-found: warn
          retention-days: 30
