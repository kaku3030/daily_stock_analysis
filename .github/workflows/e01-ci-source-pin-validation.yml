name: E01 CI Source Pin Validation

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  validate-e01-shard3:
    name: validate-e01-shard3-full-history
    runs-on: ubuntu-latest
    steps:
      - name: Checkout with pinned baseline history
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: |
            requirements.txt
            .github/requirements-ci.txt

      - name: Install CI dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r .github/requirements-ci.txt

      - name: Prove pinned production baseline is addressable
        run: |
          git cat-file -e ef27aec4d8f5cb89093399081fcd5e750473f99c^{commit}
          git show ef27aec4d8f5cb89093399081fcd5e750473f99c:realtime_monitor/server.py >/dev/null

      - name: Run exact shard 3 with auditable pytest output
        env:
          PYTEST_SPLITS: '3'
          PYTEST_GROUP: '3'
          PYTEST_FIRST_SHARD_OVERHEAD: '20'
        run: |
          python scripts/ci_test_shard.py \
            --splits "$PYTEST_SPLITS" \
            --group "$PYTEST_GROUP" \
            --first-shard-overhead "$PYTEST_FIRST_SHARD_OVERHEAD" \
            -- \
            -m "not network" \
            --timeout=120 -o timeout_method=thread \
            -o faulthandler_timeout=300 \
            --durations=30 --durations-min=0.5 \
            -ra --tb=short \
            --junitxml=.artifacts/e01-shard3-junit.xml

      - name: Upload shard 3 JUnit evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e01-shard3-junit
          path: .artifacts/e01-shard3-junit.xml
          if-no-files-found: warn
